name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m compileall -q src

      - name: Exercise the durable approval flow
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          mkdir -p "${RUNNER_TEMP}/relay-smoke"
          cd "${RUNNER_TEMP}/relay-smoke"
          python - <<'PY'
          import json
          import random
          from pathlib import Path

          random.uniform = lambda *_: 0.90
          random.randint = lambda *_: 1234567

          from relay.cli import main

          assert main(["start", "ci-run"]) == 0
          assert main(["approve", "ci-run"]) == 0
          assert main(["show", "ci-run"]) == 0
          assert main(["export", "--out", "runs.json"]) == 0

          document = json.loads(Path("runs.json").read_text(encoding="utf-8"))
          assert len(document["runs"]) == 1
          assert document["runs"][0]["status"] == "finished"
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Verify production web application
        run: pnpm --dir web verify
